[package]
name = "heimdall-gatekeeper"
version = "0.1.0"
edition = "2021"
description = "Node-side guardian daemon for the Camelot-OS Bifrost Bridge."
license = "MIT"

[dependencies]
hmac = "0.13"
sha2 = "0.11"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "heimdall-gatekeeper"
path = "src/main.rs"
